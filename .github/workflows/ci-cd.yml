name: CI and deploy

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fourth-mirror-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Never interrupt a main deployment after it has drained the bot.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      sha: ${{ steps.checkout.outputs.commit }}
    steps:
      - name: Check out the triggering commit
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check types, tests, and builds
        run: npm run cloudflare:check

  deploy:
    name: Deploy production
    needs: check
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: ${{ vars.CLOUDFLARE_BOT_URL }}
    concurrency:
      group: fourth-mirror-production
      cancel-in-progress: false
    steps:
      - name: Check out the checked commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Drain, back up, deploy, and verify the bot
        run: npm run cloudflare:update -- --ci
        env:
          GH_TOKEN: ${{ github.token }}
          CI_CHECKED_SHA: ${{ needs.check.outputs.sha }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_WORKER_NAME: ${{ vars.CLOUDFLARE_WORKER_NAME }}
          CLOUDFLARE_BOT_URL: ${{ vars.CLOUDFLARE_BOT_URL }}
          ADMIN_TOKEN: ${{ secrets.CLOUDFLARE_ADMIN_TOKEN }}
          HISTORY_BACKUP_PUBLIC_KEY: ${{ vars.HISTORY_BACKUP_PUBLIC_KEY }}
          CLOUDFLARE_BACKUP_DIR: ${{ runner.temp }}/fourth-mirror-backups
      - name: Preserve the encrypted recovery backup
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: encrypted-history-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/fourth-mirror-backups/*.enc
          if-no-files-found: ignore
          retention-days: 7
